aid: pavilion
name: Pavilion
description: 'Pavilion is a government purchasing platform that helps public-sector
  buyers find vendors, get quotes, and buy what they need without the guesswork. It
  connects procurement teams at 3,500+ SLED (state, local, and education) agencies
  with qualified vendors, surfaces the most direct compliant route to purchase based
  on each agency''s rules and existing cooperative contracts, and lets vendors claim
  a free supplier profile to get discovered. The product is 100% free for public agencies.
  Pavilion is a SaaS marketplace backed by Forerunner Ventures.'
